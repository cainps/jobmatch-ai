name: jobmatch-ai

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_NAME:-jobmatch}
      MYSQL_USER: ${DB_USER:-jobmatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      # Sem a chave, o serviço usa a análise local por palavras-chave.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3000"
      AI_SERVICE_URL: http://ai-service:8000
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-jobmatch}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-jobmatch}
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

  admin:
    build: ./admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-jobmatch}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-jobmatch}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
