name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-service:
    name: Python (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  api:
    name: Node.js/TypeScript (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Dica: depois de gerar o package-lock.json (npm install) e commitá-lo, troque por `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  admin-php:
    name: PHP (sintaxe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: for f in admin/*.php; do php -l "$f"; done

  docker:
    name: Docker Compose (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
